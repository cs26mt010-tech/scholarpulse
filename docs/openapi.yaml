  /api/v1/ai/ask:
    post:
      tags:
      - AI Study Assistant
      summary: Ask a grounded question over a single resource, a collection (<=20 resources), or a course
        code
      description: 'Executes the ScholarPulse RAG pipeline: embeds the question with `gemini-embedding-001`,
        computes cosine similarity over active (non-hidden/non-removed) chunks in scope (top 5 for single
        resource; top 8 with max 3 per resource for collection/course scope), wraps untrusted document
        chunks in strict delimiters against prompt injection, calls `gemini-2.5-flash` with a 10-second
        timeout and 1 retry, validates that every cited chunk ID was retrieved, and returns the grounded
        answer or ''Not found in this document''. Automatically falls back to MySQL FULLTEXT keyword search
        on timeout or quota exhaustion. Rate limited to 20 questions/hour per user, max 300 chars.'
      operationId: askStudyAssistant
      security:
      - SessionCookie: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAskRequest'
      responses:
        '200':
          description: Grounded answer with verified chunk citations (or keyword fallback passages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAskResponse'
        '400':
          description: Question exceeds 300 characters or invalid scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Login required to ask AI
        '429':
          description: Rate limit exceeded (max 20 questions per hour per user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
