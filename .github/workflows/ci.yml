name: ScholarPulse CI (MS-1 to MS-4)

on:
  push:
    branches: [main, "ms3*", "ms4*", "feature/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend, migrations, seed, coverage and RAG evaluation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scholarpulse_root_secret
          MYSQL_DATABASE: scholarpulse
          MYSQL_USER: sp_user
          MYSQL_PASSWORD: sp_password_2026
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pscholarpulse_root_secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql+pymysql://sp_user:sp_password_2026@127.0.0.1:3306/scholarpulse?charset=utf8mb4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile Python
        run: python -m compileall -q backend scripts

      - name: Lint with Ruff
        run: ruff check backend scripts

      - name: Validate canonical OpenAPI YAML and synchronized copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          canonical = Path("docs/openapi.yaml").read_text(encoding="utf-8")
          duplicate = Path("openapi.yaml").read_text(encoding="utf-8")
          assert canonical == duplicate, "Root openapi.yaml must match docs/openapi.yaml"
          spec = yaml.safe_load(canonical)
          assert spec["openapi"] == "3.0.3"
          assert isinstance(spec.get("paths"), dict) and spec["paths"]
          assert isinstance(spec.get("components", {}).get("schemas"), dict)
          print(f"OpenAPI 3.0.3 valid: {len(spec['paths'])} paths")
          print(f"Reusable schemas: {len(spec['components']['schemas'])}")
          PY

      - name: Apply Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Verify migration revision
        working-directory: backend
        run: alembic current

      - name: Run deterministic seed twice (idempotency check)
        run: |
          python scripts/seed_db.py
          python scripts/seed_db.py

      - name: Run Pytest with MS-5 coverage gate (minimum 70%)
        run: |
          pytest backend/tests -v \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Run RAG evaluation benchmark
        run: python scripts/evaluate_rag.py

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  frontend-e2e:
    name: Frontend browser smoke tests
    runs-on: ubuntu-latest
    needs: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: scholarpulse_root_secret
          MYSQL_DATABASE: scholarpulse
          MYSQL_USER: sp_user
          MYSQL_PASSWORD: sp_password_2026
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pscholarpulse_root_secret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql+pymysql://sp_user:sp_password_2026@127.0.0.1:3306/scholarpulse?charset=utf8mb4
      APP_ENV: test
      SESSION_COOKIE_SECURE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Apply migrations and seed database for browser tests
        working-directory: backend
        run: |
          alembic upgrade head
          cd ..
          python scripts/seed_db.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm install

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start ScholarPulse API
        run: |
          nohup uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/scholarpulse-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/scholarpulse-api.log
          exit 1

      - name: Run Playwright browser tests
        working-directory: frontend
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
